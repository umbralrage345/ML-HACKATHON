<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PathSnap | Route evaluator</title>
<link rel="stylesheet" href="styles.css">
<script src="app.js" defer></script>
</head>
<body>
<header><strong>PathSnap</strong><span>Route evaluator</span></header>
<main>
  <aside aria-label="Trip controls">
    <form id="connect">
      <label for="server">API address</label>
      <div class="connection"><input id="server" type="url" value="http://localhost:8000" required>
      <button>Connect</button></div>
    </form>
    <form id="run">
      <label for="trip">Evaluator trip</label>
      <select id="trip" required disabled><option value="">Connect to load trips</option></select>
      <button id="predict" disabled>Reconstruct route</button>
    </form>
    <p id="status" role="status" aria-live="polite">Connect to the PathSnap API.</p>
    <dl id="metrics" hidden>
      <div><dt>Aligned top-1 accuracy</dt><dd id="top1"></dd></div>
      <div><dt>Direct arc continuity</dt><dd id="continuity"></dd></div>
      <div><dt>Route sequence F1</dt><dd id="sequence_f1"></dd></div>
      <div><dt>Candidate miss rate</dt><dd id="candidate_miss"></dd></div>
      <div><dt>Aligned observations</dt><dd id="alignment"></dd></div>
    </dl>
  </aside>
  <section class="map" aria-label="Predicted route map">
    <p id="empty">Select a trip to view the predicted route.</p>
    <iframe id="map" sandbox="allow-scripts" title="PathSnap map" hidden></iframe>
  </section>
</main>
</body>
</html>
